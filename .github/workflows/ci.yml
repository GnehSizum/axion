name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_gui_smoke:
        description: Run optional Servo GUI smoke under xvfb
        required: false
        default: "false"
      run_release_preview:
        description: Run optional release preview and upload artifacts
        required: false
        default: "false"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check bridge JavaScript syntax and behavior
        run: |
          node --check crates/axion-bridge/src/assets/bootstrap.js
          node --check crates/axion-bridge/src/assets/diagnostics.js
          node --check crates/axion-bridge/src/assets/compat.js
          node --test crates/axion-bridge/tests/bootstrap.test.cjs
      - name: Check formatting
        run: cargo fmt --check
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Check doctor version metadata
        run: |
          cargo run -p axion-cli -- doctor --manifest-path examples/bridge-diagnostics-demo/axion.toml > target/axion-doctor.txt
          grep -q 'axion: cli_version=' target/axion-doctor.txt
          grep -q 'rustc.msrv: ok' target/axion-doctor.txt
      - name: Validate hello example
        run: cargo run -p axion-cli -- self-test --manifest-path examples/hello-axion/axion.toml
      - name: Validate multi-window example
        run: cargo run -p axion-cli -- self-test --manifest-path examples/multi-window/axion.toml
      - name: Validate file access example
        run: cargo run -p axion-cli -- self-test --manifest-path examples/file-access-demo/axion.toml
      - name: Validate diagnostics report example
        run: cargo run -p axion-cli -- self-test --manifest-path examples/bridge-diagnostics-demo/axion.toml --report-path target/axion/reports/bridge-diagnostics-self-test.json --quiet
      - name: Run aggregate check report
        run: |
          cargo run -p axion-cli -- check \
            --manifest-path examples/hello-axion/axion.toml \
            --dev \
            --bundle \
            --json \
            --report-path target/axion/reports/hello-check.json
      - name: Write check report summary
        run: |
          cargo run -p axion-cli -- report \
            target/axion/reports/hello-check.json \
            --output target/axion/reports/hello-check-summary.json
      - name: Check diagnostics report artifact
        run: test -s target/axion/reports/bridge-diagnostics-self-test.json
      - name: Check diagnostics report schema
        run: grep -q '"schema":"axion.diagnostics-report.v1"' target/axion/reports/bridge-diagnostics-self-test.json
      - name: Upload diagnostics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axion-diagnostics
          path: |
            target/axion-doctor.txt
            target/axion/reports/*.json
          if-no-files-found: error

  native-changes:
    name: Detect native build changes
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" HEAD -- Cargo.toml Cargo.lock rust-toolchain.toml SERVO_PROVENANCE.toml .cargo crates examples servo .github/workflows; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  native-check:
    name: Servo feature compile gate
    needs: native-changes
    if: needs.native-changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    env:
      RUSTC_BOOTSTRAP: crown,script,script_bindings,script_webgpu,style_tests,mozjs,mozjs_sys
      CC: clang-19
      CXX: clang++-19
      HOST_CC: clang-19
      HOST_CXX: clang++-19
      CLANG_PATH: /usr/bin/clang-19
      LIBCLANG_PATH: /usr/lib/llvm-19/lib
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Cache native build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'SERVO_PROVENANCE.toml') }}
          restore-keys: |
            native-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-19 libclang-19-dev cmake gperf libdbus-1-dev libfontconfig1-dev libegl1-mesa-dev libgles2-mesa-dev libglib2.0-dev libharfbuzz-dev liblzma-dev libudev-dev libunwind-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev xorg-dev libxkbcommon-dev libxkbcommon-x11-0 libvulkan1 m4
      - name: Diagnose native compiler selection
        run: |
          test -x "$CLANG_PATH"
          test -r "$LIBCLANG_PATH/libclang.so"
          "$CC" --version
          "$CXX" --version
          "$CLANG_PATH" --version
          "$CLANG_PATH" -print-resource-dir
          "$CLANG_PATH" -E -x c++ /dev/null -v
          readlink -f "$LIBCLANG_PATH/libclang.so"
      - name: Compile Servo runtime
        run: cargo check --workspace --features servo-runtime --locked

  gui-smoke:
    name: Optional GUI smoke
    env:
      RUSTC_BOOTSTRAP: crown,script,script_bindings,script_webgpu,style_tests,mozjs,mozjs_sys
      CC: clang-19
      CXX: clang++-19
      HOST_CC: clang-19
      HOST_CXX: clang++-19
      CLANG_PATH: /usr/bin/clang-19
      LIBCLANG_PATH: /usr/lib/llvm-19/lib
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.run_gui_smoke == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Cache native build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'SERVO_PROVENANCE.toml') }}
          restore-keys: |
            native-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb clang-19 libclang-19-dev cmake gperf libdbus-1-dev libfontconfig1-dev libegl1-mesa-dev libgles2-mesa-dev libglib2.0-dev libharfbuzz-dev liblzma-dev libudev-dev libunwind-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev xorg-dev libxkbcommon-dev libxkbcommon-x11-0 libvulkan1 m4
      - name: Diagnose native compiler selection
        run: |
          test -x "$CLANG_PATH"
          test -r "$LIBCLANG_PATH/libclang.so"
          "$CC" --version
          "$CXX" --version
          "$CLANG_PATH" --version
          "$CLANG_PATH" -print-resource-dir
          "$CLANG_PATH" -E -x c++ /dev/null -v
          readlink -f "$LIBCLANG_PATH/libclang.so"
      - name: Run bridge diagnostics GUI smoke
        run: |
          xvfb-run -a cargo run -p axion-cli -- gui-smoke \
            --manifest-path examples/bridge-diagnostics-demo/axion.toml \
            --report-path target/axion/reports/bridge-diagnostics-gui-smoke.json \
            --timeout-ms 30000 \
            --require-check bridge.bootstrap \
            --require-check app.ping \
            --require-check input.snapshot \
            --require-command app.ping \
            --require-command window.info \
            --require-host-event window.ready \
            --require-window main \
            --quiet
      - name: Run hello GUI smoke
        run: |
          xvfb-run -a cargo run -p axion-cli -- gui-smoke \
            --manifest-path examples/hello-axion/axion.toml \
            --report-path target/axion/reports/hello-gui-smoke.json \
            --timeout-ms 30000 \
            --require-check bridge.bootstrap \
            --require-check app.ping \
            --require-check input.snapshot \
            --require-command app.ping \
            --require-command window.info \
            --require-host-event window.ready \
            --require-window main \
            --quiet
      - name: Run file access GUI smoke
        run: |
          xvfb-run -a cargo run -p axion-cli -- gui-smoke \
            --manifest-path examples/file-access-demo/axion.toml \
            --report-path target/axion/reports/file-access-gui-smoke.json \
            --timeout-ms 30000 \
            --require-check bridge.bootstrap \
            --require-check app.ping \
            --require-check input.snapshot \
            --require-command app.ping \
            --require-command window.info \
            --require-host-event window.ready \
            --require-window main \
            --quiet
      - name: Run multi-window GUI smoke
        run: |
          xvfb-run -a cargo run -p axion-cli -- gui-smoke \
            --manifest-path examples/multi-window/axion.toml \
            --report-path target/axion/reports/multi-window-gui-smoke.json \
            --timeout-ms 30000 \
            --require-check app.ping \
            --require-check window.info \
            --require-check window.prevent_close \
            --require-check window.close_completed.event \
            --require-check window.close_timed_out.event \
            --require-check app.exit.pending \
            --require-check app.exit.idempotent \
            --require-check app.exit_prevented.event \
            --quiet
      - name: Check GUI smoke report
        run: |
          for report in target/axion/reports/*-gui-smoke.json; do
            echo "checking $report"
            test -s "$report"
            grep -q '"schema":"axion.diagnostics-report.v1"' "$report"
            grep -q '"result":"ok"' "$report"
            grep -o '"source":"[^"]*"' "$report" | head -n 1
            grep -o '"app_name":"[^"]*"' "$report" | head -n 1
          done
      - name: Write GUI smoke report summaries
        if: always()
        run: |
          for report in target/axion/reports/*-gui-smoke.json; do
            [ -f "$report" ] || continue
            summary="${report%.json}-summary.json"
            cargo run -p axion-cli -- report "$report" --allow-failed --output "$summary"
          done
      - name: Upload GUI smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axion-gui-smoke
          path: |
            target/axion/reports/*-gui-smoke.json
            target/axion/reports/*-gui-smoke-summary.json
          if-no-files-found: warn

  release-preview:
    name: Optional release preview
    env:
      RUSTC_BOOTSTRAP: crown,script,script_bindings,script_webgpu,style_tests,mozjs,mozjs_sys
      CC: clang-19
      CXX: clang++-19
      HOST_CC: clang-19
      HOST_CXX: clang++-19
      CLANG_PATH: /usr/bin/clang-19
      LIBCLANG_PATH: /usr/lib/llvm-19/lib
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.run_release_preview == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Cache native build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'SERVO_PROVENANCE.toml') }}
          restore-keys: |
            native-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Install release build dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb clang-19 libclang-19-dev cmake gperf libdbus-1-dev libfontconfig1-dev libegl1-mesa-dev libgles2-mesa-dev libglib2.0-dev libharfbuzz-dev liblzma-dev libudev-dev libunwind-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev xorg-dev libxkbcommon-dev libxkbcommon-x11-0 libvulkan1 m4
      - name: Diagnose native compiler selection
        run: |
          test -x "$CLANG_PATH"
          test -r "$LIBCLANG_PATH/libclang.so"
          "$CC" --version
          "$CXX" --version
          "$CLANG_PATH" --version
          "$CLANG_PATH" -print-resource-dir
          "$CLANG_PATH" -E -x c++ /dev/null -v
          readlink -f "$LIBCLANG_PATH/libclang.so"
      - name: Generate release application
        run: |
          cargo run -p axion-cli -- new release-preview-app --path "$RUNNER_TEMP/axion-release-preview-source"
          cp Cargo.lock "$RUNNER_TEMP/axion-release-preview-source/Cargo.lock"
      - name: Run hello release check
        run: |
          cargo run -p axion-cli -- check \
            --manifest-path "$RUNNER_TEMP/axion-release-preview-source/axion.toml" \
            --dev \
            --bundle \
            --json \
            --report-path target/axion/reports/hello-check.json
      - name: Run hello release preview
        run: |
          cargo run -p axion-cli -- release \
            --manifest-path "$RUNNER_TEMP/axion-release-preview-source/axion.toml" \
            --output-dir "$RUNNER_TEMP/axion-release-preview-bundle" \
            --check-report-path target/axion/reports/hello-check.json \
            --json \
            --report-path target/axion/reports/hello-release.json \
            --bundle-report-path target/axion/reports/hello-bundle.json \
            --archive \
            --archive-path target/axion/reports/hello-bundle.tar
      - name: Verify unpacked application without source access
        run: |
          mkdir "$RUNNER_TEMP/axion-release-unpacked"
          tar -xf target/axion/reports/hello-bundle.tar -C "$RUNNER_TEMP/axion-release-unpacked"
          mv "$RUNNER_TEMP/axion-release-preview-source" "$RUNNER_TEMP/axion-release-preview-source.hidden"
          executable="$RUNNER_TEMP/axion-release-unpacked/release-preview-app/bin/release-preview-app"
          test -x "$executable"
          cd "$RUNNER_TEMP"
          AXION_GUI_SMOKE=1 AXION_GUI_SMOKE_TIMEOUT_MS=30000 timeout 60s xvfb-run -a "$executable" > "$GITHUB_WORKSPACE/target/axion/reports/release-deployment.log" 2>&1
          python3 - <<'PYTHON'
          import json, os, pathlib
          log = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "target/axion/reports/release-deployment.log"
          prefix = "Axion GUI smoke passed: "
          reports = [json.loads(line[len(prefix):]) for line in log.read_text().splitlines() if line.startswith(prefix)]
          assert reports and reports[-1]["result"] == "ok", log.read_text()
          checks = reports[-1]["diagnostics"]["smoke_checks"]
          assert checks and all(check["status"] != "fail" for check in checks)
          assert any(check["id"] == "bridge.bootstrap" and check["status"] == "pass" for check in checks)
          PYTHON
      - name: Write release report summary
        run: |
          cargo run -p axion-cli -- report \
            target/axion/reports/hello-release.json \
            --output target/axion/reports/hello-release-summary.json
      - name: Check release preview report
        run: |
          test -s target/axion/reports/hello-check.json
          test -s target/axion/reports/hello-release.json
          test -s target/axion/reports/hello-release-summary.json
          test -s target/axion/reports/hello-bundle.json
          test -s target/axion/reports/hello-bundle.tar
          grep -q '"schema":"axion.release-report.v1"' target/axion/reports/hello-release.json
          grep -q '"result":"ok"' target/axion/reports/hello-release.json
          grep -q '"failure_phase":null' target/axion/reports/hello-release.json
          grep -q '"artifacts":' target/axion/reports/hello-release.json
          grep -q '"summary":' target/axion/reports/hello-release.json
          grep -q '"check_report_reused":true' target/axion/reports/hello-release.json
          grep -q '"verification":{"checked":true,"passed":true' target/axion/reports/hello-release.json
          grep -q '"schema":"axion.report-summary.v1"' target/axion/reports/hello-release-summary.json
      - name: Upload release preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axion-release-preview
          path: |
            target/axion/reports/hello-check.json
            target/axion/reports/hello-release.json
            target/axion/reports/hello-release-summary.json
            target/axion/reports/hello-bundle.json
            target/axion/reports/hello-bundle.tar
            target/axion/reports/release-deployment.log
          if-no-files-found: warn
